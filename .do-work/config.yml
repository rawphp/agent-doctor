# do-work configuration
# Edit this file to customize agent behavior.
# Full schema and defaults: agents/config.md (canonical template)

project:
  name: "agent-doctor"

# Work-item store: Linear is sole backend (config-only cutover 2026-08-06).
# Historical .do-work/user-requests/ + archive/ remain on disk as read-only history.
# Agents must ignore those trees for work-item ops (no dual-write).
tracker:
  backend: linear
  linear:
    team_id: "90eb3f11-da37-4bbb-a4a0-bfe245646f5d"
    team_key: "ORI"
    product_project: "fd5cce1a-4742-4fb2-83f0-dcd207b7e8f9"
    status_map:
      backlog: "Todo"
      in_progress: "In Progress"
      stopped: "Canceled"
      done: "Done"
    decisions_doc_title: "do-work/decisions"
    calibration_doc_title: "do-work/calibration"
    agent_claim_marker: "<!-- do-work-claim -->"
    ur_milestone_name_pattern: "{ur_id}: {title}"

# CLI product layers (UR-001 clarification)
layers: [cli, engine, adapters, surfaces]

test:
  suite_command: "npm test"


log:
  enabled: true
  platforms: []
  drafts_per_platform: 2
  batch_size: 2
  audience: ""
  voice: ""
  max_chars:
    x: 280
    blog: 500
    linkedin: 1300

next_steps:
  enabled: false

feedback:
  enabled: false
  repo: tomkaczocha/do-work
  label: auto:do-work-feedback
  project_repo: ""

parallel:
  stale_threshold_seconds: 900
  max_workers: 1

review:
  required: true
  adversarial: false

acceptance:
  evidence_required: true

risk:
  require_review:
    - migrations
    - auth
    - billing
    - payments
    - files_changed_over: 8
    - acceptance_criteria_over: 6

security:
  blocked_paths:
    - .env
    - .env.*
  blocked_commands:
    - rm -rf
    - git push --force
    - git push -f
    - git reset --hard
    - git checkout --

model:
  default: sonnet
  escalation: opus

cost:
  budget: ""

ledger:
  enabled: true

delivery:
  mode: merge
  pr:
    granularity: req

worktree:
  link_paths: []
  setup_command: ""

verify:
  threshold: 90

routing: []
